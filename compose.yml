# ToolRent - local deployment
#   docker compose pull && docker compose up -d
#   App:      http://localhost          (Nginx load balancer)
#   Keycloak: http://localhost:8090     (admin / admin)
#   Users:    diego / diego123 (ADMIN)  -  juan / juan123 (EMPLOYEE)

# ---------- Shared definitions ----------
x-backend: &backend
  image: izkybin/toolrent-backend:latest
  restart: on-failure
  networks:
    - toolrent-net
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

x-backend-env: &backend-env
  DB_URL: jdbc:postgresql://db:5432/toolrent
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DDL_AUTO: update
  # Token "iss" claim = URL the browser uses for Keycloak
  KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/toolrent-realm
  # Signing keys are downloaded through the internal docker network
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/toolrent-realm/protocol/openid-connect/certs

x-frontend: &frontend
  image: izkybin/toolrent-frontend:latest
  restart: on-failure
  networks:
    - toolrent-net

services:
  # 1. Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: toolrent-db
    environment:
      POSTGRES_DB: toolrent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5433 (5432 is used by the PostgreSQL installed on Windows).
      # Containers still connect through db:5432 on the internal network.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - toolrent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toolrent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Keycloak (IAM) - imports the realm (roles, client, users) on startup
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: toolrent-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Public URL written into the tokens; must match KEYCLOAK_ISSUER_URI of the backend
      KC_HOSTNAME_URL: http://localhost:8090
      KC_HOSTNAME_ADMIN_URL: http://localhost:8090
    ports:
      - "8090:8080"
    volumes:
      - ./keycloak-data/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - toolrent-net

  # 3. Backend - 3 replicas.
  #    backend-1 creates the schema and loads seed data; 2 and 3 start after it is healthy
  #    (avoids the replicas racing to create the same tables).
  backend-1:
    <<: *backend
    container_name: toolrent-backend-1
    environment:
      <<: *backend-env
      SQL_INIT_MODE: always
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  backend-2:
    <<: *backend
    container_name: toolrent-backend-2
    environment:
      <<: *backend-env
      SQL_INIT_MODE: never
    depends_on:
      backend-1:
        condition: service_healthy

  backend-3:
    <<: *backend
    container_name: toolrent-backend-3
    environment:
      <<: *backend-env
      SQL_INIT_MODE: never
    depends_on:
      backend-1:
        condition: service_healthy

  # 4. Frontend - 3 replicas (React build served by Nginx)
  frontend-1:
    <<: *frontend
    container_name: toolrent-frontend-1
  frontend-2:
    <<: *frontend
    container_name: toolrent-frontend-2
  frontend-3:
    <<: *frontend
    container_name: toolrent-frontend-3

  # 5. Nginx load balancer for backend and frontend (single entry point on port 80)
  nginx:
    image: nginx:alpine
    container_name: toolrent-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
      frontend-1:
        condition: service_started
      frontend-2:
        condition: service_started
      frontend-3:
        condition: service_started
    networks:
      - toolrent-net

volumes:
  db_data:

networks:
  toolrent-net:
    driver: bridge
