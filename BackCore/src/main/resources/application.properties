# PostgreSQL (overridden by environment variables in compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/toolrent}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Seed data (data.sql is idempotent: it only inserts into empty tables).
# In compose only backend-1 runs it (SQL_INIT_MODE=always); the other replicas use "never".
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=true

# Keycloak (IAM)
# issuer-uri: the URL the BROWSER uses to reach Keycloak (it is written into the token "iss" claim).
# jwk-set-uri: the URL the BACKEND uses to download the signing keys (docker network name inside compose).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/toolrent-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/toolrent-realm/protocol/openid-connect/certs}

# Actuator: expose only the health endpoint (used by docker compose healthchecks)
management.endpoints.web.exposure.include=health
