# Nginx load balancer (single entry point: http://localhost)
#   /api/*  -> 3 backend replicas (round robin)
#   /*      -> 3 frontend replicas (round robin)

upstream backend {
    server backend-1:8080;
    server backend-2:8080;
    server backend-3:8080;
}

upstream frontend {
    server frontend-1:80;
    server frontend-2:80;
    server frontend-3:80;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        # Trailing slash strips the /api prefix: /api/tools -> /tools
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Shows which replica answered (useful to demo the load balancing in the browser dev tools)
        add_header X-Upstream $upstream_addr always;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Upstream $upstream_addr always;
    }
}
