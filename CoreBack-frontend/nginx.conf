# Nginx config inside each frontend replica: serves the React build (SPA)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths (e.g. /tools/edit/3) fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
